services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: newlife
      POSTGRES_USER: newlife
      POSTGRES_PASSWORD: newlife_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newlife -d newlife"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=newlife;Username=newlife;Password=newlife_dev"
      Database__RunMigrationsOnStartup: "true"
      Hubtel__EnforceCallbackIp: "false"
      Seed__AdminEmail: "admin@newlife.local"
      Seed__AdminPassword: "AdminPass123"
      Seed__DemoData: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
